<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Công trình đang thi công</title>
    <style>
        /* Reset toàn bộ về trắng */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 80px;
            font-weight: 700;
            color: #333333;
            letter-spacing: 4px;
        }

        /* Hiệu ứng nhấp nháy nhẹ */
        @keyframes pulse {
            0% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
            100% {
                opacity: 1;
            }
        }

        h1 {
            animation: pulse 3s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CÔNG TRÌNH ĐANG THI CÔNG</h1>
        <p class="sub-text">Đợi thinh design!</p>
    </div>
</body>
</html>
